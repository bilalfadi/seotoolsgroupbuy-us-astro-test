settings:
  content:
    merge: true

media:
  - name: uploads
    label: Images
    input: public/media
    output: /media
    categories: [image]
content:
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, slug, price] }
    operations: { rename: false, delete: false }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true, readonly: true }
      - { name: status, label: Publication Status, type: select, default: publish, options: { values: [publish, draft, private] } }
      - { name: featuredImage, type: string }
      - { name: featuredAlt, type: string }
      - { name: price, type: string }
      - { name: regularPrice, type: string }
      - { name: salePrice, type: string }
      - { name: shortDescription, type: rich-text, options: { format: html, media: uploads } }
      - { name: content, type: rich-text, options: { format: html, media: uploads, switcher: false } }
      - { name: externalUrl, type: string }
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }
      - { name: focusKeyword, type: string }
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, slug] }
    operations: { rename: false, delete: false }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true, readonly: true }
      - { name: status, label: Publication Status, type: select, default: publish, options: { values: [publish, draft, private] } }
      - { name: featuredImage, type: string }
      - { name: excerpt, type: rich-text, options: { format: html, media: uploads } }
      - { name: content, type: rich-text, options: { format: html, media: uploads, switcher: false } }
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }
      - { name: focusKeyword, type: string }
      - { name: author, label: Post Author, type: string }
      - { name: authorImage, label: Author Photo, type: image, options: { media: uploads } }
      - { name: authorJobTitle, label: Author Job Title, type: string }
      - { name: authorOrganization, label: Author Organization, type: string }
  - name: pages
    label: Website Pages
    type: collection
    path: content/pages
    exclude: [home.json]
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, slug] }
    operations: { rename: false, delete: false }
    fields:
      - { name: title, type: string, required: true }
      - { name: slug, type: string, required: true, readonly: true }
      - { name: status, label: Publication Status, type: select, default: publish, options: { values: [publish, draft, private] } }
      - { name: content, type: rich-text, options: { format: html, media: uploads, switcher: false } }
      - { name: seoTitle, type: string }
      - { name: seoDescription, type: text }

  - name: landings
    label: Ahrefs and Semrush Landing Sections
    type: collection
    path: content/landings
    format: json
    filename: "{landing}.json"
    view: { primary: landing }
    operations: { create: false, rename: false, delete: false }
    fields:
      - { name: landing, type: string, required: true }
      - name: sections
        label: Landing Sections
        type: object
        list: true
        fields:
          - { name: key, type: string }
          - name: html
            label: Landing Section Content (Visual Editor)
            type: rich-text
            options: { format: html, media: uploads, switcher: false }

  - name: contact-settings
    label: Contact Details
    type: file
    path: content/settings/contact.json
    format: json
    operations: { delete: false }
    fields:
      - { name: supportEmail, label: Support Email, type: string, required: true }
      - { name: adminEmail, label: Abuse Reports Email, type: string, required: true }
      - { name: mailingAddress, label: Mailing Address, type: text }
      - { name: phone, label: Phone, type: string }

  - name: blog-author-settings
    label: Blog Author Defaults
    type: file
    path: content/settings/blog-author.json
    format: json
    operations: { delete: false }
    fields:
      - { name: name, label: Name, type: string }
      - { name: jobTitle, label: Job Title, type: string }
      - { name: organization, label: Organization, type: string }
      - { name: image, label: Photo, type: image, options: { media: uploads } }

  - name: policy-links
    label: Policy Page Button Links
    type: file
    path: content/settings/policy-links.json
    format: json
    operations: { delete: false }
    fields:
      - { name: dmcaPolicy, label: DMCA Agent Email Link, type: string, required: true }
      - { name: privacyPolicy, label: Privacy Policy Contact Link, type: string, required: true }
      - { name: refundPolicy, label: Refund Request Link, type: string, required: true }
      - { name: termsConditions, label: Terms Support Link, type: string, required: true }

  - name: homepage_seo
    label: Homepage SEO and Featured Image
    type: file
    path: content/pages/home.json
    format: json
    fields:
      - { name: seoTitle, label: Homepage SEO Title, type: string }
      - { name: seoDescription, label: Homepage Meta Description, type: text }
      - { name: focusKeyword, label: Focus Keyword, type: string }
      - { name: featuredImage, label: Sharing / Featured Image, type: image, options: { media: uploads } }
      - { name: featuredAlt, label: Featured Image Alt Text, type: string }

  - name: homepage-sections
    label: Homepage - Easy Section Editor
    type: file
    path: content/home-editor.json
    format: json
    fields:
      - name: sections
        label: Homepage Sections
        type: object
        list:
          collapsible: { collapsed: true, summary: "{name}" }
        fields:
          - { name: name, label: Section, type: string, readonly: true }
          - name: items
            label: Headings, paragraphs, buttons and links
            type: object
            list:
              collapsible: { collapsed: true, summary: "{text}" }
            fields:
              - { name: text, label: Visible Text, type: text }
              - { name: url, label: Link URL, type: string }
              - { name: kind, label: Element Type, type: string, hidden: true }
              - { name: originalText, type: text, hidden: true }
              - { name: originalUrl, type: string, hidden: true }
              - { name: source, type: text, hidden: true }
              - { name: offset, type: number, hidden: true }

  - name: site-settings
    label: Header, Footer, Logos and Social Links
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: brand, label: Website Name, type: string }
      - { name: headerLogo, label: Header Logo, type: image, options: { media: uploads } }
      - { name: footerLogo, label: Footer Logo, type: image, options: { media: uploads } }
      - { name: favicon, label: Favicon, type: image, options: { media: uploads } }
      - { name: joinText, label: Signup Button Label, type: string }
      - { name: joinUrl, label: Signup URL, type: string }
      - { name: loginText, label: Login Button Label, type: string }
      - { name: loginUrl, label: Login URL, type: string }
      - { name: mobileMenuTitle, label: Mobile Menu Title, type: string }
      - { name: footerDescription, label: Footer Description, type: text }
      - { name: followHeading, label: Social Links Heading, type: string }
      - { name: quickLinksHeading, label: Footer Quick Links Heading, type: string }
      - { name: supportHeading, label: Support Heading, type: string }
      - { name: disclaimer, label: Disclaimer, type: text }
      - { name: copyright, label: Copyright Text, type: string }
      - name: nav
        label: Main Navigation Menu
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Link Text, type: string }
          - { name: url, label: Destination, type: string }
      - name: topbar
        label: Top Bar Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Link Text, type: string }
          - { name: url, label: Destination, type: string }
      - name: social
        label: Social Media Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Link Text, type: string }
          - { name: url, label: Destination, type: string }
      - name: quickLinks
        label: Footer Quick Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Link Text, type: string }
          - { name: url, label: Destination, type: string }
      - name: supportLinks
        label: Footer Support Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Link Text, type: string }
          - { name: url, label: Destination, type: string }
      - name: legalLinks
        label: Bottom Policy Links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Link Text, type: string }
          - { name: url, label: Destination, type: string }
