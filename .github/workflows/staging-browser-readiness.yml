name: Offline source code readiness audit
on:
  workflow_dispatch:
  push:
    paths:
      - content/**
      - src/**
      - migration/seo-xml-baseline.json
      - scripts/seo-xml-parity.mjs
      - scripts/code-readiness.mjs
      - scripts/materialize-legacy-media.mjs
      - package.json
      - public/**
      - .github/workflows/staging-browser-readiness.yml
permissions:
  contents: read
jobs:
  code-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit all published routes, local assets, internal links, metadata and order URLs
        run: node scripts/code-readiness.mjs
      - name: Compare all original Yoast SEO fields against built Astro HTML
        run: node scripts/seo-xml-parity.mjs
      - name: Upload detailed offline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-code-readiness
          path: |
            reports/code-readiness.json
            reports/seo-xml-parity.json
            reports/legacy-media-compatibility.json
          if-no-files-found: warn
