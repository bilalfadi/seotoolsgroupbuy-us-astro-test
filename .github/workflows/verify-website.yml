name: Website verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify imported content and SEO
        run: npm run verify
      - name: Check redirects and link migration
        run: npm run audit
      - name: Build static website
        run: npm run build
      - name: Verify generated SEO endpoints
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_redirects
          grep -q 'https://seotoolsgroupbuy.us/ahrefs/' dist/sitemap.xml
          grep -q 'https://seotoolsgroupbuy.us/semrush-group-buy/' dist/sitemap.xml
          grep -q 'Sitemap: https://seotoolsgroupbuy.us/sitemap.xml' dist/robots.txt
