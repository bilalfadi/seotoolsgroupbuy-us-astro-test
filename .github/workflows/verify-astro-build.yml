name: Verify Astro test build
on:
  workflow_dispatch:
  push:
    paths:
      - src/**
      - content/**
      - public/assets/js/**
      - public/assets/css/**
      - .pages.yml
      - package.json
      - scripts/**
      - public/_redirects
      - .github/workflows/verify-astro-build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed Cloudflare 301 rules match generated rules
        run: git diff --exit-code -- public/_redirects
      - name: Verify imported content
        run: npm run verify
