name: Sync exact product links from live WordPress
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/sync-live-links.mjs
      - .github/workflows/sync-live-links.yml
permissions:
  contents: write
jobs:
  sync-links:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit exact live product links without modifying checkout destinations
        run: node scripts/sync-live-links.mjs
      - name: Commit audit report only to test repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live-link-audit.json reports/live-link-audit.csv
          if ! git diff --cached --quiet; then
            git commit -m "Audit live checkout hrefs from original website (no auto updates)"
            git push
          fi
